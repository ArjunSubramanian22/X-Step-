[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xstep-ml"
version = "0.3.0"
description = "Four-site plantar pressure ML and EHB experiment pipelines for DFU prevention"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0,<2.5",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "Pillow>=10.4.0",
    "joblib>=1.4.0",
    "tqdm>=4.66.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pytest>=8.3.0",
]

[project.optional-dependencies]
dl = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "kagglehub>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["xstep_ml*"]
